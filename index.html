<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOR成績查詢系統</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #000000;
            --border-color: #9ca3af;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        /* 背景浮水印設定 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo.jpg'); /* 若您的圖片是 logo.png 請在此修改 */
            background-size: 350px;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            padding: 32px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            margin-bottom: 28px;
            color: #000000;
            letter-spacing: 0.5px;
        }

        h1 span {
            background: linear-gradient(135deg, #2563eb, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #000000;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
            color: #6b7280;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        .status-message {
            text-align: center;
            padding: 16px;
            font-size: 0.95rem;
            color: #000000;
            font-weight: 500;
        }

        .result-section {
            margin-top: 32px;
        }

        .result-section h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
            color: #000000;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
            min-width: 400px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            font-weight: 700;
            color: #000000;
        }

        td {
            color: #000000;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><span>COLOR</span> 成績查詢系統</h1>

        <div class="form-group">
            <label for="classInput">班別</label>
            <input type="text" id="classInput" placeholder="請輸入班別（例如：A班）" onblur="loadItems()">
        </div>

        <div class="form-group">
            <label for="nameInput">姓名</label>
            <input type="text" id="nameInput" placeholder="請輸入姓名（例如：王小明）" onblur="loadItems()">
        </div>

        <div class="form-group">
            <label for="itemSelect">項目</label>
            <select id="itemSelect" disabled>
                <option value="">請先輸入班別與姓名 ▼</option>
            </select>
        </div>

        <button onclick="queryScores()">查詢成績</button>

        <div id="statusArea"></div>

        <div class="result-section" id="resultSection" style="display: none;">
            <h2>查詢結果</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>測驗日期</th>
                            <th>教練</th>
                            <th>項目</th>
                            <th>成績</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody">
                        <!-- 動態插入查詢結果 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 替換成您剛剛從 Apps Script 複製的完整網頁應用程式 URL
        const API_URL = "https://script.google.com/macros/s/您的部署ID/exec";

        const classInput = document.getElementById('classInput');
        const nameInput = document.getElementById('nameInput');
        const itemSelect = document.getElementById('itemSelect');
        const statusArea = document.getElementById('statusArea');
        const resultSection = document.getElementById('resultSection');
        const resultBody = document.getElementById('resultBody');

        async function loadItems() {
            const className = classInput.value.trim();
            const name = nameInput.value.trim();

            if (!className || !name) {
                itemSelect.innerHTML = '<option value="">請先輸入班別與姓名 ▼</option>';
                itemSelect.disabled = true;
                return;
            }

            statusArea.innerHTML = '<div class="status-message">載入項目中...</div>';
            try {
                const response = await fetch(`${API_URL}?action=items&className=${encodeURIComponent(className)}&name=${encodeURIComponent(name)}`);
                const items = await response.json();

                itemSelect.innerHTML = '<option value="ALL">全部項目</option>';
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    itemSelect.appendChild(option);
                });

                itemSelect.disabled = false;
                statusArea.innerHTML = '';
            } catch (error) {
                console.error(error);
                statusArea.innerHTML = '<div class="status-message" style="color: red;">項目載入失敗</div>';
            }
        }

        async function queryScores() {
            const className = classInput.value.trim();
            const name = nameInput.value.trim();
            const selectedItem = itemSelect.value;

            if (!className || !name) {
                alert("請先填寫班別與姓名");
                return;
            }

            statusArea.innerHTML = '<div class="status-message">查詢中...</div>';
            resultSection.style.display = 'none';

            try {
                let url = `${API_URL}?className=${encodeURIComponent(className)}&name=${encodeURIComponent(name)}`;
                if (selectedItem && selectedItem !== "ALL") {
                    url += `&item=${encodeURIComponent(selectedItem)}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                statusArea.innerHTML = '';

                if (!data || data.length === 0) {
                    statusArea.innerHTML = '<div class="status-message">查無測驗成績</div>';
                    return;
                }

                resultBody.innerHTML = '';
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.coach}</td>
                        <td>${row.item}</td>
                        <td>${row.score}</td>
                    `;
                    resultBody.appendChild(tr);
                });

                resultSection.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusArea.innerHTML = '<div class="status-message" style="color: red;">資料載入失敗，請稍後再試</div>';
            }
        }
    </script>
</body>
</html>
